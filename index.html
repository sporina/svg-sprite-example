<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resco web tool prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- SVG sprite: each icon is a <symbol>, referenced below via <use href="#id"> -->
    <svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true">
        <symbol id="icon-save" viewBox="0 0 24 24">
            <path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm2 16H5V5h11.17L19 7.83V19zm-7-7c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zM6 6h9v4H6z"/>
        </symbol>
    </svg>

    <main>
        <nav></nav>
    </main>

    <div class="toolbar">
        <button class="toolbar-button--size-s">
            <svg class="icon-size-s" aria-hidden="true"><use href="#icon-save"></use></svg>
            <span>Label</span>
        </button>
        <div class="separator"></div>
        <button class="toolbar-button--size-s">
            <svg class="icon-size-s" aria-hidden="true"><use href="#icon-save"></use></svg>
            <span>Label</span>
        </button>
    </div>
</body>

</html>
